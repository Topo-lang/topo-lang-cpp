[topo]
root = "main.topo"

[build]
language = "cpp"
sources = ["main.cpp"]
output = "main"

[completeness]
# `ChartData` is the debug-view anchor type: main.topo declares it so the
# `debug ChartData` entry has a type to attach its views to, but the host
# code has no class `ChartData` — the views bind to the stack-local
# `int data[8]` array in main.cpp by name at the breakpoint. The
# declared-but-not-found completeness warning is therefore correct, not an
# extractor miss; suppress it so the fixture stays check-clean now that
# every `topo build` runs topo-check by default (same pattern as
# topo-lang-java's project_simple fixture).
ignore_patterns = ["app::ChartData"]
